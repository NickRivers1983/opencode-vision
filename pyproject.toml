[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "opencode-vision"
description = "Model-agnostic image analysis via MCP for OpenCode text-only models. Vision proxy server using Google Gemini + tesseract."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Nicolás Ríos Herrera", email = "nrios@icesi.edu.co" },
]
keywords = [
    "opencode", "mcp", "vision", "image-analysis", "gemini", "tesseract",
    "ocr", "multimodal", "model-context-protocol", "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/NickRivers1983/opencode-vision"
Repository = "https://github.com/NickRivers1983/opencode-vision"
Documentation = "https://github.com/NickRivers1983/opencode-vision#readme"
Issues = "https://github.com/NickRivers1983/opencode-vision/issues"

[project.optional-dependencies]
pillow = ["pillow>=10"]
tesseract = []  # system dependency: brew install tesseract / apt install tesseract-ocr

[project.scripts]
opencode-vision = "opencode_vision.__main__:main"

[tool.setuptools.packages.find]
include = ["opencode_vision*"]

[tool.setuptools.dynamic]
version = { attr = "opencode_vision.__version__" }
